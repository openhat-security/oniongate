name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source_branch: ${{ steps.source.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag commit on main or staging
        id: source
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags origin staging:refs/remotes/origin/staging || true
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"

          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            branch=main
          elif git show-ref --verify --quiet refs/remotes/origin/staging &&
               git merge-base --is-ancestor "$tag_commit" origin/staging
          then
            branch=staging
          else
            echo "::error::Release tags must point to a commit reachable from main or staging"
            exit 1
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Release source branch: $branch"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          shared-key: release-verify
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            cpio
      - run: npm ci
      - run: npm run deps
      - run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm run fmt:check
      - run: npm run lint:rust
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: npm run docs:build
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  prepare:
    name: Validate tag and create draft
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.signing.outputs.prerelease }}
      macos_signed: ${{ steps.signing.outputs.macos_signed }}
      windows_signed: ${{ steps.signing.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Validate synchronized versions and changelog
        run: |
          make changelog-check
          node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" release-notes.md
      - name: Resolve signing posture
        id: signing
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SOURCE_BRANCH: ${{ needs.verify.outputs.source_branch }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"

          # The updater keypair costs nothing to generate, so it stays a hard
          # requirement: without it the updater manifest cannot be trusted.
          for name in UPDATER_KEY UPDATER_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing release secret $name"; exit 1; }
          done

          macos_signed=true
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_BASE64
          do
            if [[ -z "${!name}" ]]; then macos_signed=false; fi
          done

          windows_signed=true
          if [[ -z "$WINDOWS_CERTIFICATE" ]]; then
            windows_signed=false
          elif [[ -z "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::WINDOWS_CERTIFICATE_PASSWORD is required with WINDOWS_CERTIFICATE"
            exit 1
          fi

          # Hyphenated semver (e.g. 0.2.5-alpha.1) and staging-origin tags are
          # GitHub prereleases — never Latest / updater channel.
          prerelease=false
          if [[ "$SOURCE_BRANCH" == staging || "$version" == *-* ]]; then
            prerelease=true
          fi

          # 1.0 is the trust milestone. Pre-1.0 may ship unsigned so the project
          # can distribute builds before the paid signing programs are in place,
          # but every stable release must be signed on every platform.
          if [[ "$version" != 0.* && "$prerelease" == false ]]; then
            if [[ "$macos_signed" != true ]]; then
              echo "::error::Stable releases require the Apple signing and notarization secrets"
              exit 1
            fi
            if [[ "$windows_signed" != true ]]; then
              echo "::error::Stable releases require WINDOWS_CERTIFICATE"
              exit 1
            fi
          fi

          if [[ "$macos_signed" != true ]]; then
            echo "::warning::macOS artifacts will be unsigned and un-notarized"
          fi
          if [[ "$windows_signed" != true ]]; then
            echo "::warning::Windows artifacts will be unsigned"
          fi

          {
            echo "macos_signed=$macos_signed"
            echo "windows_signed=$windows_signed"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Prepend unsigned-build warning to the release notes
        if: >-
          steps.signing.outputs.macos_signed != 'true' ||
          steps.signing.outputs.windows_signed != 'true'
        env:
          MACOS_SIGNED: ${{ steps.signing.outputs.macos_signed }}
          WINDOWS_SIGNED: ${{ steps.signing.outputs.windows_signed }}
        shell: bash
        run: |
          {
            echo "> [!WARNING]"
            echo "> **This build is not signed with an OS vendor certificate.**"
            echo "> Verify it against \`SHA256SUMS\` and the build provenance"
            echo "> attestation before you run it."
            echo ">"
            if [[ "$MACOS_SIGNED" != true ]]; then
              echo "> - **macOS**: unsigned and un-notarized. Gatekeeper will refuse the"
              echo ">   first launch. See the install guide for the required steps."
            fi
            if [[ "$WINDOWS_SIGNED" != true ]]; then
              echo "> - **Windows**: unsigned. SmartScreen will warn on first run."
            fi
            echo
            cat release-notes.md
          } > release-notes.annotated.md
          mv release-notes.annotated.md release-notes.md
      - name: Create or refresh the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.verify.outputs.source_branch }}
          PRERELEASE: ${{ steps.signing.outputs.prerelease }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          title="OnionGate $GITHUB_REF_NAME"
          if [[ "$SOURCE_BRANCH" == staging ]]; then
            title="$title (staging)"
          fi

          # Drafts have no tag ref, so /releases/tags/{tag} never finds them and
          # the list endpoint can still be serving a cached page seconds after a
          # write. Create through the REST API so the id comes back with the
          # response instead of from a follow-up query.
          existing="$(
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty"
          )"

          body="$(
            jq -n \
              --arg tag "$GITHUB_REF_NAME" \
              --arg name "$title" \
              --rawfile notes release-notes.md \
              --argjson prerelease "$PRERELEASE" \
              '{
                tag_name: $tag,
                name: $name,
                body: $notes,
                draft: true,
                prerelease: $prerelease,
                make_latest: "false"
              }'
          )"

          if [[ -n "$existing" ]]; then
            release_id="$(
              printf '%s' "$body" |
                gh api --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/$existing" \
                  --input - --jq .id
            )"
          else
            release_id="$(
              printf '%s' "$body" |
                gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/releases" \
                  --input - --jq .id
            )"
          fi

          test -n "$release_id"
          echo "Draft release id: $release_id"

          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            extension: ""
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
            bundles: app,dmg
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ""
            bundles: appimage,deb,rpm
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: ".exe"
            bundles: nsis
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-build-deps.sh
      - run: npm ci
      - name: Stage verified runtimes
        run: npm run deps
      - name: Build and stage privileged helper
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          cargo build \
            --manifest-path src-tauri/Cargo.toml \
            --release \
            --bin oniongate-helper \
            --target "$TARGET"
          source_path="src-tauri/target/$TARGET/release/oniongate-helper$EXTENSION"
          destination="src-tauri/binaries/oniongate-helper-$TARGET$EXTENSION"
          test -f "$source_path"
          cp "$source_path" "$destination"
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod 755 "$destination"; fi
      - name: Prepare Apple notarization API key
        if: runner.os == 'macOS' && needs.prepare.outputs.macos_signed == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "oniongate-signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert) { throw "Windows signing certificate import failed" }
          "TAURI_CONFIG={""bundle"":{""windows"":{""certificateThumbprint"":""$($cert.Thumbprint)"",""digestAlgorithm"":""sha256"",""timestampUrl"":""http://timestamp.digicert.com""}}}" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Two variants because the bundler reads APPLE_CERTIFICATE with var_os:
      # an empty-but-present value still enters the keychain import path and
      # fails. GitHub Actions cannot omit an env key conditionally, so the
      # unsigned path must not reference the Apple secrets at all.
      - name: Build, sign, and upload
        if: runner.os != 'macOS' || needs.prepare.outputs.macos_signed == 'true'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: >-
            --verbose
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
          # The metadata job assembles latest.json from the uploaded payloads,
          # so builds never race to rewrite a shared manifest.
          includeUpdaterJson: false
          retryAttempts: 5
      - name: Build and upload (unsigned macOS)
        if: runner.os == 'macOS' && needs.prepare.outputs.macos_signed != 'true'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: >-
            --verbose
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: false
          retryAttempts: 5
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNED: ${{ needs.prepare.outputs.macos_signed }}
        run: |
          app_bundle="$(printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/macos/*.app | head -n 1)"
          test -d "$app_bundle"
          test -x "$app_bundle/Contents/MacOS/oniongate-helper"
          test -x "$app_bundle/Contents/MacOS/OnionGate"
          dmg="$(printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg | head -n 1)"
          test -f "$dmg"

          if [[ "$MACOS_SIGNED" != true ]]; then
            echo "::warning::Skipping notarization checks for an unsigned build"
            exit 0
          fi

          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          spctl --assess --type execute --verbose=4 "$app_bundle"
          xcrun stapler validate "$app_bundle"
          xcrun stapler validate "$dmg"
          helper_team="$(
            codesign -dv --verbose=4 "$app_bundle/Contents/MacOS/oniongate-helper" 2>&1 |
              awk -F= '/^TeamIdentifier=/{print $2}'
          )"
          test "$helper_team" = "$APPLE_TEAM_ID"
      # Tauri 2 has no pkg bundle target, so the installer is a post-bundle step
      # built from the .app that tauri-action just produced. It uploads to the
      # same draft release from inside this job, and `metadata` needs `build`,
      # so the .pkg is already an asset when SHA256SUMS is assembled from them.
      - name: Build and upload the macOS installer package
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          app_bundle="$(
            printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/macos/*.app | head -n 1
          )"
          bash scripts/build-macos-pkg.sh \
            --app "$app_bundle" \
            --target "$TARGET" \
            --version "$VERSION"

          pkg="$(printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/pkg/*.pkg | head -n 1)"
          test -f "$pkg"
          gh release upload "$GITHUB_REF_NAME" "$pkg" --clobber
      - name: Verify Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          compgen -G "src-tauri/target/$TARGET/release/bundle/appimage/*.AppImage" >/dev/null
          compgen -G "src-tauri/target/$TARGET/release/bundle/deb/*.deb" >/dev/null
          compgen -G "src-tauri/target/$TARGET/release/bundle/rpm/*.rpm" >/dev/null

          deb="$(printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/deb/*.deb | head -n 1)"
          rm -rf "$RUNNER_TEMP/oniongate-deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/oniongate-deb"
          test -x "$RUNNER_TEMP/oniongate-deb/usr/bin/oniongate-helper"
          # mainBinaryName is OnionGate; CLI is oniongate-cli (not shipped as /usr/bin/oniongate).
          test -x "$RUNNER_TEMP/oniongate-deb/usr/bin/OnionGate"

          appimage="$(
            printf '%s\n' src-tauri/target/"$TARGET"/release/bundle/appimage/*.AppImage |
              head -n 1
          )"
          chmod +x "$appimage"
          (
            cd "$RUNNER_TEMP"
            rm -rf squashfs-root
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
            test -x squashfs-root/usr/bin/oniongate-helper
            test -x squashfs-root/usr/bin/OnionGate
          )
      - name: Verify Windows bundles and signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis" -Filter *.exe |
            Select-Object -First 1
          if (-not $installer) { throw "No NSIS setup executable was generated" }
          if ($env:WINDOWS_CERTIFICATE) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $($installer.FullName): $($signature.Status)"
            }
          }

          $extract = Join-Path $env:RUNNER_TEMP "oniongate-nsis"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract | Out-Null
          & 7z x $installer.FullName "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed: $LASTEXITCODE" }
          $helper = Get-ChildItem $extract -Recurse -Filter oniongate-helper.exe
          if (-not $helper) { throw "NSIS setup does not contain oniongate-helper.exe" }

  metadata:
    name: Checksums, SBOMs, and provenance
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Download built release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --clobber
          rm -f release-assets/SHA256SUMS release-assets/SHA256SUMS.sig
          rm -f release-assets/*.cdx.json release-assets/latest.json
      - name: Assemble the updater manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/build-updater-manifest.mjs \
            release-assets \
            "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            release-assets/latest.json
          cat release-assets/latest.json
      - name: Generate source and sidecar SBOMs
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json
          npx --yes @cyclonedx/cyclonedx-npm \
            --package-lock-only \
            --ignore-npm-errors \
            --output-file npm.cdx.json
          node scripts/generate-sidecar-sbom.mjs sidecars.cdx.json
          cp src-tauri/*.cdx.json release-assets/
          cp npm.cdx.json sidecars.cdx.json release-assets/
      - name: Generate and sign checksums
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          (
            cd release-assets
            sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS
          )
          npm run --silent tauri -- signer sign release-assets/SHA256SUMS
      - name: Upload release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/latest.json \
            release-assets/SHA256SUMS \
            release-assets/SHA256SUMS.sig \
            release-assets/*.cdx.json \
            --clobber
      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}
          if-no-files-found: error
          path: release-assets/
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Only flip the draft once every artifact, checksum, SBOM, and
          # attestation is in place, so the tag is never briefly downloadable
          # without its verification material.
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --latest="$latest"
