name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch comparison base
        run: git fetch --no-tags origin "${{ github.base_ref || 'main' }}":"refs/remotes/origin/${{ github.base_ref || 'main' }}"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Changelog trail
        env:
          CHANGELOG_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: make changelog-check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-build-deps.sh
      - run: npm ci
      - run: npm run deps
      - run: npm run typecheck
      - run: npm run fmt:check
      - run: npm run lint:rust
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: npm audit --omit=dev --audit-level=high
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
