[package]
name = "tor-socks-gui"
version = "0.2.2"
description = "OnionGate — Tor Workstation Toolkit with isolated routing and Onion Host"
authors = ["adamsiwiec"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/irruptio-security/oniongate"
homepage = "https://irruptio-security.github.io/oniongate/"
default-run = "tor-socks-gui"

[lib]
name = "tor_socks_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oniongate"
path = "src/bin/oniongate_cli.rs"

# Privileged helper daemon. Platform service installers register it once.
# Typed protocol only — see docs/guide/daemons.md.
[[bin]]
name = "oniongate-helper"
path = "src/bin/oniongate_helper.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread", "macros", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
dirs = "6"
thiserror = "2"
which = "7"
hex = "0.4"
libc = "0.2"
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
data-encoding = "2.11.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
sha2 = "0.11.0"
clap = { version = "4.6.4", features = ["derive"] }

# Windows-only: run the privileged helper as a Windows service (SCM).
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
